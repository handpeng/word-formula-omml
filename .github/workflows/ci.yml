name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Check out clean source
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Pandoc
        uses: pandoc/actions/setup@v1
        with:
          version: 3.1.11
      - name: Run dependency preflight
        run: python scripts/preflight.py --json preflight.json
      - name: Run regression tests
        run: python -m unittest discover -s tests
      - name: Compile source and tests
        run: python -m py_compile word_formula_omml/*.py scripts/*.py tests/*.py
