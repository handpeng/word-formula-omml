name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - uses: pandoc/actions/setup@v1
        with:
          version: 3.1.11
      - name: Check
        run: |
          python scripts/preflight.py
          python -m unittest discover -s tests
          python -m py_compile word_formula_omml/*.py scripts/*.py tests/*.py
